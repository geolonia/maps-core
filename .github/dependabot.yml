version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # typedoc 0.28 は typescript を 6.0.x まで peer 宣言しており、typescript 7 と
      # 同居できない。dev-dependencies グループに typescript 7 が混ざると npm ci が
      # ERESOLVE で落ち、他の更新も巻き添えで止まる。6.x までは typedoc と同居できる
      # ので止めない。typedoc が typescript 7 に対応したら、この ignore を外す。
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # vitest と @vitest/* は必ず同じ PR で同時に動かす。
      #
      # @vitest/coverage-v8 は vitest を patch まで厳密一致で peer 宣言しており
      # （coverage-v8@5.0.1 → vitest 5.0.1）、片方だけ動くと npm ci が ERESOLVE で
      # 落ちる。セキュリティ更新は脆弱なパッケージしか対象にせず、グループ化は
      # 更新対象の判定を変えないため、その経路では相方が上がらない。日常的に
      # バージョン更新で揃えておくことで、勧告が来た時点でずれている確率を下げる。
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # 残りは種別ごとにまとめ、PR 数を抑える。
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
      production-dependencies:
        dependency-type: "production"
