name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run build:umd
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: dist
          path: dist/

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      # Node 24.x ships npm 11 which properly supports OIDC provenance publishing
      # (npm 10.9.x on Node 22 returns E404 on scoped packages with --provenance)
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@geolonia'
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # GitHub Release first — idempotent and safe to retry
      - name: Create UMD tarball
        run: tar -czf maps-core-umd.tar.gz -C dist/umd .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PRERELEASE=""
          if echo "$TAG" | grep -q '\-pre\.'; then
            PRERELEASE="--prerelease"
          fi
          # Delete existing release if re-running after partial failure
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE \
            maps-core-umd.tar.gz

      # npm publish last — once published, the version is immutable
      # --ignore-scripts skips prepare; --provenance uses OIDC (id-token: write)
      - name: Publish (latest)
        if: "!contains(github.ref, '-pre.')"
        run: npm publish --access=public --ignore-scripts --provenance

      - name: Publish (next)
        if: "contains(github.ref, '-pre.')"
        run: npm publish --access=public --tag=next --ignore-scripts --provenance
